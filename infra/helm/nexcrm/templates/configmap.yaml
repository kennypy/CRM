apiVersion: v1
kind: ConfigMap
metadata:
  name: nexcrm-env
  labels:
    app.kubernetes.io/part-of: nexcrm
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  {{- range $k, $v := .Values.global.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- range $k, $v := .Values.serviceUrls }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
