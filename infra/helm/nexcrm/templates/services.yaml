{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexcrm.fullname" $name }}
  labels:
    {{- include "nexcrm.labels" $ctx | nindent 4 }}
spec:
  {{- if not $.Values.global.hpa.enabled }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "nexcrm.selectorLabels" $ctx | nindent 6 }}
  template:
    {{- include "nexcrm.podTemplate" $ctx | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexcrm.fullname" $name }}
  labels:
    {{- include "nexcrm.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nexcrm.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nexcrm.fullname" $name }}
  labels:
    {{- include "nexcrm.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ $.Values.global.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "nexcrm.selectorLabels" $ctx | nindent 6 }}
{{- if $.Values.global.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "nexcrm.fullname" $name }}
  labels:
    {{- include "nexcrm.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "nexcrm.fullname" $name }}
  minReplicas: {{ max 2 $svc.replicas }}
  maxReplicas: {{ $svc.maxReplicas | default 4 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.global.hpa.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
{{- end }}
{{- end }}
