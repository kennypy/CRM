global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Remote write receiver is enabled via CLI flag --web.enable-remote-write-receiver
# OTel collector pushes service metrics (HTTP server/client, DB) via remote write.

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Synthetic readiness probes. Targets use compose service names (full-stack
  # profile). For services run natively with `npm run dev`, replace with
  # host.docker.internal:<port>.
  - job_name: blackbox-health
    metrics_path: /probe
    params:
      module: [http_ready]
    static_configs:
      - targets:
          - http://api-gateway:4000/health/ready
          - http://auth:4001/health/ready
          - http://graph-core:4002/health/ready
          - http://outreach:4003/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
